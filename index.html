            const container = document.getElementById('filter-buttons');
            // 初始化先置入「全部」按鈕，並預設為 active 啟用狀態
            container.innerHTML = `
                <button onclick="filterTiers('all')" 
                        class="filter-btn active bg-red-600 text-white border border-red-600 flex items-center justify-center">
                    全部
                </button>
            `;

            // 依據資料庫（tiersData）為每個 Tier（例如 T0, T1...）動態新增對應按鈕
            tiersData.forEach(tier => {
                const btn = document.createElement('button');
                // 預設樣式套用灰色框線與 hover 紅框過渡效果
                btn.className = 'filter-btn border border-gray-300 hover:border-red-400 flex items-center justify-center';
                btn.textContent = tier.name;
                btn.onclick = () => filterTiers(tier.id);
                container.appendChild(btn);
            });
        }

        /**
         * 圖片載入失敗後的備用替換邏輯（修正並優化版本）
         */
        function handleImageError(imgElement, basePath) {
            // 定義要嘗試的候補副檔名（照順序：webp -> jpg -> jpeg -> png -> PNG）
            const extensions = ['.webp', '.jpg', '.jpeg', '.png', '.PNG'];
            
            // 讀取當前正在嘗試的副檔名索引，若未設定則從 0 開始
            let currentTryIdx = parseInt(imgElement.getAttribute('data-try-idx') || '0');

            if (currentTryIdx < extensions.length) {
                // 還沒試完所有格式，繼續嘗試下一個
                const nextSrc = basePath + extensions[currentTryIdx];
                imgElement.setAttribute('data-try-idx', currentTryIdx + 1);
                imgElement.src = nextSrc;
            } else {
                // 所有格式都載不出來，載入通用預設圖
                if (basePath.startsWith('IP/')) {
                    imgElement.src = 'UATier0/image.png'; // 系列封面預設圖
                } else {
                    imgElement.src = 'UATier0/image.png'; // 推薦卡組預設圖
                }
                // 清除屬性並拔除 onerror 避免破圖時無限循環
                imgElement.removeAttribute('data-try-idx');
                imgElement.onerror = null; 
            }
        }

        /**
         * 篩選強度層級並重新著色按鈕狀態
         * @param {string} filter - 欲篩選的 Tier ID（例如 'T0', 'T1' 或 'all'）
         */
        function filterTiers(filter) {
            currentFilter = filter;
            // 遍歷所有篩選按鈕，切換 Active（選中紅色）與 Normal（預設灰色）樣式
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const isActive = (filter === 'all' && btn.textContent === '全部') || btn.textContent === filter;
                if (isActive) {
                    btn.classList.add('active', 'bg-red-600', 'text-white', 'border-red-600');
                } else {
                    btn.classList.remove('active', 'bg-red-600', 'text-white', 'border-red-600');
                }
            });
            // 點擊後重新渲染強度表列表
            renderTiers();
        }

            const div = document.createElement('div');
            div.className = 'rounded-3xl overflow-hidden border border-gray-100 bg-white shadow-xl';
            
            // 1. 生成大區塊內的「卡片縮圖網格 HTML」
            let cardsHTML = '';
            const images = tier.images || [];
            images.forEach(img => {
                const src = typeof img === 'string' ? img : img.src;
                const alt = typeof img === 'string' ? `${tier.name} card image` : img.alt;
                
                // 提取不含副檔名的路徑主檔名（例如："UATier1/1.png" -> "UATier1/1"）
                const basePath = src.substring(0, src.lastIndexOf('.')) || src;

                cardsHTML += `
                    <div class="flex justify-center">
                        <img src="${src}" 
                             alt="${alt}" 
                             class="tier-img"
                             data-try-idx="0"
                             onerror="handleImageError(this, '${basePath}')">
                    </div>`;
            });

            // 2. 組裝區塊內部的整體 HTML（漸層頂部、RWD 網格系統、強度分析框）
            // 網格設定：手機版 4 欄、平板 5~6 欄、電腦版 7~8 欄，因應大量圖片排版
            div.innerHTML = `
                <!-- 頂部漸層色標籤 -->
                <div class="bg-gradient-to-r ${tier.color} px-8 py-6 text-white">
                    <div class="flex items-center gap-6">
                        <div class="text-5xl font-black">${tier.name}</div>
                        <p class="text-2xl">${tier.desc}</p>
                    </div>
                </div>
                <!-- 內容卡牌區與分析區 -->
                <div class="p-8">
                    <!-- RWD 響應式卡牌圖片網格 -->
                    <div class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-7 xl:grid-cols-8 gap-4">
                        ${cardsHTML}
                    </div>
                    <!-- 強度分析欄位 -->
                    <div class="mt-8 bg-gray-50 border border-gray-100 rounded-2xl p-6 text-gray-700">
                        <strong class="text-red-600">強度分析：</strong> ${tier.analysis}
                    </div>
                </div>
            `;
            return div;
        }

        /**
         * 執行渲染 Tier List 列表
         */
        function renderTiers() {
            const container = document.getElementById('tiers');
            container.innerHTML = ''; // 清空目前的容器

            // 根據 currentFilter 過濾要顯示的資料（'all' 則全部保留，否則只篩出匹配 ID 的項目）
            const filteredTiers = currentFilter === 'all' ? tiersData : tiersData.filter(t => t.id === currentFilter);
            
            // 循環將生成的 HTML 元素插入至主頁面容器中
            filteredTiers.forEach(tier => container.appendChild(createTier(tier)));
        }

        // 當網頁載入完成後執行的初始化工作
        window.onload = () => {
            createFilterButtons(); // 1. 生成篩選按鈕
            renderTiers();         // 2. 渲染 Tier List 資料
            
            // 3. 備註：若想讓更新時間完全由您寫死，可以直接把下面這行註解或刪除；
            //    目前保留此行以實現載入時自動將「最後更新時間」更新為系統今日日期。
            document.getElementById('update-date').textContent = 
                new Date().toLocaleDateString('zh-HK', { year: 'numeric', month: '2-digit', day: '2-digit' });
        };
    </script>
</body>
</html>
